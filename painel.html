<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Informações</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="Painel">
        <h3>Painel de Rotas</h3>
        <div class="info-linha">
            <span class="data">Data: 01/01/2024</span>
            <span class="hora">Hora: 12:00</span>
        </div>

        <div class="info-linha">
            <h2>Rotas </h2>
            <span class="linha">Linha: 123</span>
            <p>Identificações de rota</p>
        </div>

        <div class="info-linha">
            <h2>origem -> destino</h2>
            <span class="origem">Origem: Cidade A</span>
            <span class="seta"> -> </span>
            <span class="destino">Destino: Cidade B</span>
        </div>

        <div class="info-linha">
            <h2>Paradas</h2>
            <p>Identificações de parada</p>
        </div>
    </div>
</body>
</html>
